name: Keep-Alive Cron Job

on:
  schedule:
    # اجرا در هر ۶ ساعت (0: دقیقه، */6: هر ۶ ساعت)
    - cron: '0 */6 * * *'
  workflow_dispatch: # امکان اجرای دستی از داخل گیت‌هاب

jobs:
  ping-job:
    runs-runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run ping script
        run: python ping.py
