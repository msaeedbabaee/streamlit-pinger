name: Keep-Alive Cron Job

on:
  schedule:
    # هر ۶ ساعت یک‌بار اجرا می‌شود
    - cron: '0 */6 * * *'
  workflow_dispatch: # امکان اجرای دستی را فراهم می‌کند

jobs:
  ping-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run ping script
        run: python ping.py
